<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b35"><title>PourPlan | Beverage Inventory</title>
<style>
:root{--g:#1d5b4c;--dark:#173b35;--bg:#f5f7f4;--line:#e1e8e3;--muted:#687873;--red:#a63d35;--amber:#93620c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1d302d;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:var(--dark);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1350px)/2));position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:800}.brand b{background:#d5e9dc;color:var(--dark);padding:5px 9px;border-radius:9px;margin-right:8px}.top small{color:#c4d6ce}.layout{max-width:1350px;margin:auto;display:grid;grid-template-columns:205px 1fr;min-height:calc(100vh - 64px)}aside{padding:24px 12px;border-right:1px solid var(--line);background:#fbfcfa}.nav{width:100%;border:0;background:none;text-align:left;padding:11px;border-radius:9px;color:#52645d;font-weight:650;margin:2px 0}.nav.active,.nav:hover{background:#e5f1ec;color:var(--g)}main{padding:30px clamp(16px,3vw,38px) 80px;min-width:0}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--g);font-weight:800;letter-spacing:1px;text-transform:uppercase}h1{font-size:28px;margin:5px 0;letter-spacing:-.7px}.sub{color:var(--muted);font-size:14px;margin:0}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700;color:#1d302d}.btn.primary{background:var(--g);color:white;border-color:var(--g)}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 6px 20px #173b350b;min-width:0}.statlabel{font-size:12px;color:var(--muted);font-weight:650}.statvalue{font-size:27px;font-weight:800;margin:5px 0}.muted{font-size:11px;color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 0 11px}.section h2{font-size:17px;margin:0}.tablewrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:730px}th{text-align:left;background:#f8faf8;color:#788780;font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf1ee;font-size:13px}tr:last-child td{border:0}.pname{font-weight:750}.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:800;white-space:nowrap}.good{background:#e5f1ec;color:#1d5b4c}.warn{background:#fff3d7;color:#93620c}.bad{background:#fae9e7;color:#a63d35}.neutral{background:#eef1ef;color:#5e6c65}.empty{text-align:center;padding:35px;color:var(--muted)}.empty b{display:block;color:#1d302d;margin-bottom:5px}.two{grid-template-columns:1.2fr .8fr}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#52645d}.field input,.field select{padding:10px;border:1px solid #dce5df;border-radius:8px;width:100%;background:white}.hint{font-size:11px;color:#7b8982}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:12px;border-radius:9px;background:#edf4ef;color:#426456;font-size:12px;margin:12px 0}.notice.warn{background:#fff3d7;color:#80580d}.modalback{position:fixed;inset:0;background:#0e1f1a77;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modalback.open{display:flex}.modal{background:white;border-radius:15px;width:min(550px,100%);max-height:90vh;overflow:auto;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0;font-size:19px}.x{border:0;background:#eef2ef;border-radius:7px;padding:5px 10px}.toast{position:fixed;right:18px;bottom:18px;background:var(--dark);color:white;padding:12px 16px;border-radius:9px;display:none;z-index:30}.toast.show{display:block}.mobile{display:none}.rec{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ee}.rec:last-child{border:0}.smallcaps{font-size:10px;color:#819087;text-transform:uppercase;font-weight:800;letter-spacing:.7px}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:6px 3px calc(6px + env(safe-area-inset-bottom))}.mobile .nav{width:auto;text-align:center;font-size:10px;padding:7px 8px;margin:0}.main{padding-bottom:90px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:520px){.top{height:56px;padding:0 15px}.top small{display:none}main{padding:20px 13px 90px}.head{flex-direction:column}h1{font-size:25px}.head .actions{width:100%}.head .actions button{flex:1}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:13px}.mobile .nav{padding:7px 5px;font-size:9px}}
</style></head><body>
<header class="top"><div class="brand"><b>◒</b>PourPlan</div><small>RESTAURANT BEVERAGE INVENTORY · PROTOTYPE</small></header>
<div class="layout"><aside id="side"></aside><main id="main"></main></div><nav class="mobile" id="mobile"></nav>
<div class="modalback" id="back"><div class="modal"><div class="modalhead"><h2 id="mtitle"></h2><button class="x" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='pourplan_v1',days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],pages=[['dashboard','▦ Dashboard'],['inventory','▤ Beverages'],['sales','↘ Record sale'],['suppliers','⇄ Suppliers'],['orders','□ Orders & receipts']];
let db=load(),page='dashboard';
// One-time migration: older saved records may have sales-based demand selected.
// Switch existing beverages to manual estimates while preserving all other saved data.
if(!localStorage.getItem('pourplan_manual_demand_migration_v2')){db.products.forEach(p=>{p.demandMode='manual';p.demandModeChosen=true});localStorage.setItem('pourplan_manual_demand_migration_v2','1');localStorage.setItem(KEY,JSON.stringify(db));}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||blank()}catch{return blank()}}function blank(){return{suppliers:[],products:[],sales:[],orders:[],transactions:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return Math.random().toString(36).slice(2,10)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function datefmt(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function supplierName(sid){return db.suppliers.find(s=>s.id===sid)?.name||'No supplier'}
function schedule(s,now=new Date()){if(!s)return null;for(let n=0;n<15;n++){let c=new Date(now);c.setHours(0,0,0,0);c.setDate(c.getDate()+((+s.cutoffDay-c.getDay()+7)%7)+n*7);let [h,m]=s.cutoffTime.split(':').map(Number);c.setHours(h,m,0,0);if(c<now)continue;let d=new Date(c),delta=(+s.deliveryDay-d.getDay()+7)%7;if(!delta)delta=7;d.setDate(d.getDate()+delta);let dMidnight=new Date(d);dMidnight.setHours(0,0,0,0);let todayMidnight=new Date(now);todayMidnight.setHours(0,0,0,0);return{cutoff:c,delivery:d,days:Math.max(1,Math.round((dMidnight-todayMidnight)/86400000))}}return null}
function demand(p){let mode=p.demandModeChosen&&p.demandMode==='sales'?'sales':'manual',now=new Date(),start=new Date(now);start.setDate(start.getDate()-28);let a=db.sales.filter(x=>x.productId===p.id&&new Date(x.date)>=start&&new Date(x.date)<=now);let hasManual=p.manualDemand!==''&&p.manualDemand!=null;if(mode==='sales'){if(!a.length)return{daily:null,source:'No recent sales data'};let total=a.reduce((n,x)=>n+x.qty,0),earliest=Math.min(...a.map(x=>new Date(x.date).getTime())),spanDays=Math.min(28,Math.max(1,Math.ceil((now-earliest)/86400000))),denom=spanDays>=28?28:spanDays;return{daily:total/denom,source:`Recorded sales (${denom}d)`}}if(hasManual)return{daily:+p.manualDemand,source:'Manual estimate'};return{daily:null,source:a.length?'Choose recorded sales to use sales history':'Not available'}}
function calc(p){let s=db.suppliers.find(x=>x.id===p.supplierId),sc=schedule(s),dm=demand(p);if(!sc||dm.daily===null)return{status:'Unavailable',cls:'neutral',sc,dm,trigger:null,reason:!s?'Supplier missing':!sc?'Schedule unavailable':'Add sales or demand estimate'};let expected=dm.daily*sc.days,trigger=expected+(+p.safety||0),status=p.stock<=trigger?'Reorder now':p.stock<=trigger*1.2?'Reorder soon':'Sufficient';return{status,cls:status==='Reorder now'?'bad':status==='Reorder soon'?'warn':'good',sc,dm,trigger,expected}}
function nav(){let make=()=>pages.map(([k,t])=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');side.innerHTML='<div class="smallcaps" style="padding:8px 11px">Workspace</div>'+make()+'<div class="notice" style="margin:25px 5px">Prototype data is stored in this browser on this device.</div>';mobile.innerHTML=make()}
function go(p){page=p;render()}function render(){nav();({dashboard,inventory,sales:salesPage,suppliers:suppliersPage,orders:ordersPage}[page]||dashboard)(main)}
function header(k,t,s,b=''){return`<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="sub">${s}</p></div><div class="actions">${b}</div></div>`}
function stat(l,v,f){return`<div class="card"><div class="statlabel">${l}</div><div class="statvalue">${v}</div><div class="muted">${f}</div></div>`}
function badge(c){return`<span class="badge ${c.cls}">${esc(c.status)}</span>`}
const statusRank={'Reorder now':0,'Reorder soon':1,'Unavailable':2,'Sufficient':3};function sortRows(rows){return[...rows].sort((a,b)=>{let r=(statusRank[a.c.status]??9)-(statusRank[b.c.status]??9);if(r)return r;let ca=a.c.sc?a.c.sc.cutoff.getTime():Infinity,cb=b.c.sc?b.c.sc.cutoff.getTime():Infinity;return ca-cb})}
function dashboard(el){let rows=sortRows(db.products.map(p=>({p,c:calc(p)}))),urgent=rows.filter(x=>x.c.status==='Reorder now').length,soon=rows.filter(x=>x.c.status==='Reorder soon').length,missing=rows.filter(x=>x.c.status==='Unavailable').length;el.innerHTML=header('Operations overview','Inventory dashboard','See what is on hand and which beverages need attention.',`<button class="btn" onclick="seed()">Load demo data</button><button class="btn primary" onclick="openProduct()">+ Add beverage</button>`)+`<div class="grid stats">${stat('Active beverages',db.products.length,'Products in catalogue')}${stat('Reorder now',urgent,'At or below trigger')}${stat('Reorder soon',soon,'Within 20% of trigger')}${stat('Needs setup',missing,'Missing demand or schedule')}</div><div class="section"><h2>Products requiring attention</h2><button class="btn small" onclick="go('inventory')">View all →</button></div><div class="card">${urgent+soon?sortRows(rows.filter(x=>['Reorder now','Reorder soon'].includes(x.c.status))).map(({p,c})=>`<div class="rec"><div><b>${esc(p.name)}</b><div class="muted">${esc(supplierName(p.supplierId))} · ${p.stock} ${esc(p.unit)} on hand · trigger ${Math.ceil(c.trigger)}</div></div><div>${badge(c)}<div class="muted" style="text-align:right">Order by ${datefmt(c.sc.cutoff)}</div></div></div>`).join(''):'<div class="empty"><b>No urgent recommendations</b>Add products and supplier schedules to begin.</div>'}</div><div class="section"><h2>Stock position</h2></div>${table(rows.slice(0,10),false)}`}
function table(rows,actions=true){if(!rows.length)return'<div class="card empty"><b>No beverages yet</b>Add a beverage to start tracking stock.</div>';return`<div class="tablewrap"><table><thead><tr><th>Beverage</th><th>On hand</th><th>Avg daily / weekly demand</th><th>Trigger</th><th>Supplier / cutoff & delivery</th><th>Status</th>${actions?'<th></th>':''}</tr></thead><tbody>${rows.map(({p,c})=>`<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.brand)} · ${esc(p.unit)}</div></td><td><b>${p.stock}</b> ${esc(p.unit)}</td><td>${c.dm.daily===null?'—':`${c.dm.daily.toFixed(2)}/day · ${(c.dm.daily*7).toFixed(1)}/wk`}<div class="muted">${esc(c.dm.source)}</div></td><td>${c.trigger===null?'—':Math.ceil(c.trigger)+' '+esc(p.unit)}</td><td>${esc(supplierName(p.supplierId))}<div class="muted">${c.sc?`Order by ${datefmt(c.sc.cutoff)} ${esc(db.suppliers.find(s=>s.id===p.supplierId)?.cutoffTime||'')} → Deliv. ${datefmt(c.sc.delivery)} (${c.sc.days}d)`:esc(c.reason)}</div></td><td>${badge(c)}</td>${actions?`<td><button class="btn small" onclick="openProduct('${p.id}')">Edit</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function transactionsTable(){if(!db.transactions.length)return'<div class="card empty">No inventory transactions yet.</div>';return`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Beverage</th><th>Type</th><th>Change</th><th>Reason / note</th></tr></thead><tbody>${[...db.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30).map(t=>`<tr><td>${datefmt(t.date)}</td><td>${esc(db.products.find(p=>p.id===t.productId)?.name||'Deleted product')}</td><td>${esc(t.type)}</td><td><b>${t.change>0?'+'+t.change:t.change}</b></td><td>${esc(t.reason||t.note||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function inventory(el){el.innerHTML=header('Catalogue & stock','Beverages','Manage products, units, current stock, and safety stock.',`<button class="btn primary" onclick="openProduct()">+ Add beverage</button>`)+table(sortRows(db.products.map(p=>({p,c:calc(p)}))))+`<div class="section"><h2>Inventory transaction history</h2></div>`+transactionsTable()}
function salesPage(el){el.innerHTML=header('Daily operations','Record a sale','Enter units sold. Stock and demand calculations update automatically.')+`<div class="grid two"><div class="card"><h3>New sales transaction</h3><form onsubmit="recordSale(event)"><div class="formgrid"><div class="field full"><label>Beverage</label><select name="pid" required>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.stock} ${esc(p.unit)} available</option>`).join('')}</select></div><div class="field"><label>Quantity sold</label><input name="qty" type="number" min="1" step="1" required></div><div class="field"><label>Date and time</label><input name="date" type="datetime-local" required value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="field full"><label>Note (optional)</label><input name="note" placeholder="e.g. evening shift"></div></div><div class="formactions"><button class="btn primary">Save sale & update stock</button></div></form></div><div class="card"><h3>Demand calculation</h3><p class="sub">Each beverage uses the demand method selected in its settings.</p><div class="notice">Manual estimate is the default and remains active regardless of sales history. To calculate demand from sales, edit the beverage and select ‘Use recorded sales’. PourPlan averages sales over the observed period, up to 28 days.</div><span class="smallcaps">Sales records: ${db.sales.length}</span></div></div><div class="section"><h2>Recent sales</h2></div>${salesTable()}`}
function salesTable(){if(!db.sales.length)return'<div class="card empty">No sales recorded yet.</div>';return`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Beverage</th><th>Quantity sold</th><th>Note</th></tr></thead><tbody>${[...db.sales].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,30).map(s=>`<tr><td>${datefmt(s.date)}</td><td>${esc(db.products.find(p=>p.id===s.productId)?.name||'Deleted product')}</td><td>−${s.qty}</td><td>${esc(s.note)}</td></tr>`).join('')}</tbody></table></div>`}
function suppliersPage(el) {
  let todayDay = new Date().getDay();
  el.innerHTML =
    header('Delivery planning', 'Suppliers', 'Set each supplier’s weekly delivery day and order cutoff.',
      `<button class="btn primary" onclick="openSupplier()">+ Add supplier</button>`) +
    (db.suppliers.length
      ? `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${db.suppliers.map(s => {
          let sc = schedule(s);
          let today = new Date();
          let rolled = +s.cutoffDay === todayDay && sc &&
            (sc.cutoff.getFullYear() !== today.getFullYear() ||
             sc.cutoff.getMonth() !== today.getMonth() ||
             sc.cutoff.getDate() !== today.getDate());
          return `<div class="card">
            <div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b><button class="btn small" onclick="openSupplier('${s.id}')">Edit</button></div>
            <div class="notice">Cutoff: <b>${days[s.cutoffDay]} ${esc(s.cutoffTime)}</b><br>Delivery: <b>${days[s.deliveryDay]}</b></div>
            <span class="smallcaps">Next opportunity (${sc ? `${sc.days} day${sc.days === 1 ? '' : 's'} until delivery` : 'unavailable'})</span>
            <p><b>${sc ? `${datefmt(sc.cutoff)} ${esc(s.cutoffTime)} → ${datefmt(sc.delivery)}` : 'Schedule unavailable'}</b></p>
            ${rolled ? `<div class="notice warn">Today's cutoff time (${esc(s.cutoffTime)}) has passed — rolled to next week's cycle.</div>` : ''}
          </div>`;
        }).join('')}</div>`
      : '<div class="card empty"><b>No suppliers yet</b>Add a supplier before creating a beverage.</div>');
}
function ordersPage(el){el.innerHTML=header('Purchasing workflow','Orders & receipts','Track orders placed externally and record received deliveries.')+`<div class="notice">PourPlan does not send orders to suppliers. Mark an order as placed after contacting your supplier. Stock increases only when the delivery is received.</div>`+(db.orders.length?`<div class="tablewrap"><table><thead><tr><th>Order</th><th>Supplier</th><th>Items</th><th>Placed</th><th>Expected</th><th>Status / action</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td>#${o.id.slice(-5).toUpperCase()}</td><td>${esc(supplierName(o.supplierId))}</td><td>${o.items.map(i=>`${esc(db.products.find(p=>p.id===i.productId)?.name||'Product')} × ${i.qty}`).join('<br>')}</td><td>${datefmt(o.created)}</td><td>${datefmt(o.expected)}</td><td>${o.status==='Received'?'<span class="badge good">Received</span>':`<span class="badge warn">Ordered</span> <button class="btn small" onclick="receiveOrder('${o.id}')">Receive delivery</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty"><b>No orders recorded</b>Open a beverage record and choose Create order.</div>')}
function modal(title,body){mtitle.textContent=title;mbody.innerHTML=body;back.classList.add('open')}function closeModal(){back.classList.remove('open')}
function openSupplier(sid){let s=db.suppliers.find(x=>x.id===sid)||{name:'',contact:'',cutoffDay:2,cutoffTime:'12:00',deliveryDay:5};modal(sid?'Edit supplier':'Add supplier',`<form onsubmit="saveSupplier(event,'${sid||''}')"><div class="formgrid"><div class="field full"><label>Supplier name</label><input name="name" required value="${esc(s.name)}"></div><div class="field full"><label>Contact / note</label><input name="contact" value="${esc(s.contact||'')}"></div><div class="field"><label>Order cutoff day</label><select name="cutoffDay">${days.map((d,i)=>`<option value="${i}" ${i==s.cutoffDay?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Cutoff time</label><input name="cutoffTime" type="time" required value="${s.cutoffTime}"></div><div class="field full"><label>Weekly delivery day</label><select name="deliveryDay">${days.map((d,i)=>`<option value="${i}" ${i==s.deliveryDay?'selected':''}>${d}</option>`).join('')}</select></div></div><p class="hint">Delivery is assumed to occur on the next configured delivery weekday after the cutoff.</p><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save supplier</button></div></form>`)}
function saveSupplier(e,sid){e.preventDefault();let f=new FormData(e.target),s={id:sid||id(),name:f.get('name').trim(),contact:f.get('contact').trim(),cutoffDay:+f.get('cutoffDay'),cutoffTime:f.get('cutoffTime'),deliveryDay:+f.get('deliveryDay')};if(s.cutoffDay===s.deliveryDay){toast('Delivery must be on a later weekday than cutoff.');return}if(sid)db.suppliers=db.suppliers.map(x=>x.id===sid?s:x);else db.suppliers.push(s);save();closeModal();render();toast('Supplier saved.')}
function openProduct(pid){if(!db.suppliers.length){toast('Add a supplier first.');go('suppliers');return}let p=db.products.find(x=>x.id===pid)||{name:'',brand:'',unit:'bottles',supplierId:db.suppliers[0].id,stock:0,safety:0,manualDemand:''};modal(pid?'Edit beverage':'Add beverage',`<form onsubmit="saveProduct(event,'${pid||''}')"><div class="formgrid"><div class="field full"><label>Beverage / product name</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Brand</label><input name="brand" value="${esc(p.brand)}"></div><div class="field"><label>Unit</label><select name="unit">${['bottles','cans','kegs','cases','other'].map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label>Supplier</label><select name="supplierId">${db.suppliers.map(s=>`<option value="${s.id}" ${s.id===p.supplierId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Current stock</label><input name="stock" type="number" min="0" step="1" required value="${p.stock}"></div><div class="field"><label>Safety stock (${esc(p.unit)})</label><input name="safety" type="number" min="0" step="1" required value="${p.safety}"></div><div class="field"><label>Manual average demand / day</label><input name="manualDemand" type="number" min="0" step=".01" value="${p.manualDemand??''}" placeholder="e.g. 8"></div><div class="field"><label>Demand calculation method</label><select name="demandMode"><option value="manual" ${(!p.demandModeChosen||p.demandMode!=='sales')?'selected':''}>Use manual estimate</option><option value="sales" ${p.demandModeChosen&&p.demandMode==='sales'?'selected':''}>Use recorded sales</option></select></div><div class="field full hint">Manual estimate is the default and stays in use until you choose recorded sales. Keep the same unit for stock, sales, and safety stock.</div>${pid?`<div class="field full"><label>Stock adjustment reason (required if stock changes)</label><select name="reason"><option value="">Select reason...</option><option>Physical count correction</option><option>Breakage</option><option>Spillage</option><option>Data correction</option><option>Other</option></select></div><div class="field full"><label>Additional note (optional)</label><input name="adjustmentNote" placeholder="Add context for this adjustment"></div>`:''}</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save beverage</button></div></form>${pid?`<div class="formactions" style="justify-content:space-between"><button class="btn small" onclick="createOrder('${pid}')">Create order</button><button class="btn small" onclick="deleteProduct('${pid}')">Delete</button></div>`:''}`)}
function saveProduct(e,pid){e.preventDefault();let f=new FormData(e.target),p={id:pid||id(),name:f.get('name').trim(),brand:f.get('brand').trim(),unit:f.get('unit'),supplierId:f.get('supplierId'),stock:+f.get('stock'),safety:+f.get('safety'),manualDemand:f.get('manualDemand'),demandMode:f.get('demandMode')||'manual',demandModeChosen:true};if(p.stock<0||p.safety<0){toast('Check quantities.');return}if(pid){let old=db.products.find(x=>x.id===pid);if(old.stock!==p.stock){let reason=(f.get('reason')||'').trim();if(!reason){toast('Select a reason for changing current stock.');return}db.transactions.push({id:id(),productId:pid,type:'Adjustment',change:p.stock-old.stock,reason,note:(f.get('adjustmentNote')||'').trim(),date:new Date().toISOString()})}db.products=db.products.map(x=>x.id===pid?p:x)}else{db.products.push(p);db.transactions.push({id:id(),productId:p.id,type:'Opening stock',change:p.stock,reason:'Initial setup',date:new Date().toISOString()})}save();closeModal();render();toast('Beverage saved.')}
function deleteProduct(pid){if(!confirm('Delete this beverage?'))return;db.products=db.products.filter(p=>p.id!==pid);save();closeModal();render()}
function recordSale(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===f.get('pid')),q=+f.get('qty');if(!p||q>p.stock){toast('Insufficient stock. Available: '+(p?.stock??0));return}p.stock-=q;let s={id:id(),productId:p.id,qty:q,date:new Date(f.get('date')).toISOString(),note:f.get('note')};db.sales.push(s);db.transactions.push({id:id(),productId:p.id,type:'Sale',change:-q,date:s.date,note:s.note});save();render();toast('Sale recorded; inventory updated.')}
function createOrder(pid){let p=db.products.find(x=>x.id===pid),c=calc(p);if(!c.sc||c.trigger===null){toast('Add a valid supplier schedule and demand estimate.');return}let qty=Math.max(1,Math.ceil(c.trigger*1.5-p.stock));db.orders.push({id:id(),supplierId:p.supplierId,created:new Date().toISOString(),expected:c.sc.delivery.toISOString(),status:'Ordered',items:[{productId:p.id,qty}]});save();closeModal();go('orders');toast('Order marked as placed. Contact supplier separately.')}
function receiveOrder(oid){let o=db.orders.find(x=>x.id===oid);modal('Receive delivery',`<form onsubmit="confirmReceive(event,'${oid}')"><div class="notice">Stock increases only after confirming the quantity actually received.</div><div class="formgrid">${o.items.map((i,n)=>`<div class="field full"><label>${esc(db.products.find(p=>p.id===i.productId)?.name||'Product')} — quantity received</label><input name="q${n}" type="number" min="0" step="1" value="${i.qty}" required></div>`).join('')}</div><div class="formactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Confirm receipt</button></div></form>`)}
function confirmReceive(e,oid){e.preventDefault();let o=db.orders.find(x=>x.id===oid),f=new FormData(e.target);o.items.forEach((i,n)=>{let p=db.products.find(x=>x.id===i.productId),q=+f.get('q'+n);if(p&&q>0){p.stock+=q;db.transactions.push({id:id(),productId:p.id,type:'Delivery received',change:q,date:new Date().toISOString()})}});o.status='Received';save();closeModal();render();toast('Delivery received; stock updated.')}
function seed(){if((db.products.length||db.suppliers.length)&&!confirm('Replace existing app data with demo data?'))return;let today=new Date(),cut=(today.getDay()+1)%7,del=(cut+3)%7;db={suppliers:[{id:'demo-sup',name:'Northside Beverage Supply',contact:'Sample supplier',cutoffDay:cut,cutoffTime:'12:00',deliveryDay:del}],products:[{id:'lager',name:'House Lager',brand:'Northside Lager',unit:'bottles',supplierId:'demo-sup',stock:48,safety:10,manualDemand:8},{id:'ipa',name:'Craft IPA',brand:'Hoppy Trail',unit:'cans',supplierId:'demo-sup',stock:90,safety:12,manualDemand:3}],sales:[],orders:[],transactions:[]};save();go('dashboard');toast('Demo data loaded. Try recording a sale.')}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
render();
</script></body></html>
